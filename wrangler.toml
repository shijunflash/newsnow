# 由 Hermes 2026-10 生成：给 Pages 项目 newsnow 绑定 D1 缓存库
# 上游模板为 example.wrangler.toml，此处填入真实 database_id。
# 作用：开启 NewsNow 的源缓存（server/database/cache.ts），
#       降低对上游的抓取频率、避免被限流（B站等按 IP 限流的源会明显改善）。
name = "newsnow"
pages_build_output_dir = "dist/output/public"
compatibility_date = "2024-10-03"

[[d1_databases]]
binding = "NEWSNOW_DB"
database_name = "newsnow-db"
database_id = "00c0eac1-a077-49b0-869c-cbc9e7ac9f14"
